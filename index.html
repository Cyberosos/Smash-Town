<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8263A">
<meta name="description" content="Smash tasks to grow a colorful town. Built for ADHD brains.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smash Town">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Smash Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Living town scene on top, task stack below, fixed bottom nav with a big red add button. */
:root{
  --bg:#FFF4EC; --card:#FFFFFF; --ink:#2A1414; --muted:#7E5148; --line:#F3DDD2; --chip:#D9C2B8;
  --red:#E8263A; --red-deep:#A3122A; --red-ink:#C8102E;
  --orange:#FF8A1F; --yellow:#FFC93C; --yellow-deep:#C78A00; --gold-ink:#8A4A00;
  --teal:#13B5A6; --purple:#7B4BE0; --pink:#FF5FA2; --blue:#2F7DF6;
  --wood:#9A5B2E; --wood-dark:#6B3B1A; --fence:#FFF4EC;
  --sky:#2F7DF6; --cloud:#A9CBFF; --cloud2:#CFE1FF; --grass:#13A35A; --hill:#1FBF6B; --stem:#0B6E3B; --lamp:#FFE08A;
  --font:'Fredoka', ui-rounded, 'Nunito', system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 128px;box-sizing:border-box}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.date{font-size:15px;font-weight:500;color:var(--muted)}
h1{margin:0;font-size:32px;font-weight:700;line-height:1.05;text-wrap:balance}
.top-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.coins{display:flex;align-items:center;gap:8px;background:var(--yellow);padding:7px 14px 7px 7px;border-radius:999px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.coins.bump{animation:coinBump .5s ease-out}

/* town scene */
.scene{position:relative;height:200px;margin-top:14px;border-radius:28px;background:var(--sky);overflow:hidden;transition:height .35s cubic-bezier(.3,1.2,.5,1)}
.scene.tall{height:340px}
.sun{position:absolute;top:16px;left:22px;width:42px;height:42px;border-radius:50%;background:var(--yellow);animation:sun 3s ease-in-out infinite}
.rays{position:absolute;top:-8px;left:-3px;width:92px;height:92px;animation:rays 18s linear infinite}
.cloud{position:absolute;left:0;border-radius:20px;animation:drift linear infinite}
.spark{position:absolute;width:8px;height:8px;border-radius:2px;background:#fff;transform:rotate(45deg);animation:twinkle 2.4s ease-in-out infinite}
.fly{position:absolute;top:70px;left:60px;display:flex;animation:flutter 9s ease-in-out infinite}
.fly i{display:block;width:11px;height:13px;border-radius:50%;background:var(--pink);animation:wing .25s ease-in-out infinite}
.hill{position:absolute;left:-50px;right:-50px;bottom:-70px;height:150px;border-radius:50%;background:var(--hill)}
.scroller{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
.scroller::-webkit-scrollbar{display:none}
.row{display:flex;align-items:flex-end;gap:0;padding:0 6px;min-width:100%;width:max-content;height:100%;box-sizing:border-box;background:linear-gradient(to top,var(--grass) 0 40px,transparent 40px)}
.plot{position:relative;height:100%;min-width:92px;box-sizing:border-box;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:0 18px 30px}
.plot+.plot::before{content:'';position:absolute;left:-7px;bottom:20px;width:14px;height:30px;background:linear-gradient(var(--fence),var(--fence)) 0 7px/100% 3px no-repeat,linear-gradient(var(--fence),var(--fence)) 0 19px/100% 3px no-repeat,linear-gradient(var(--fence),var(--fence)) 1px 0/4px 100% no-repeat,linear-gradient(var(--fence),var(--fence)) 9px 0/4px 100% no-repeat}
.sign{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:var(--wood);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 0 var(--wood-dark)}
.plot.today .sign{background:var(--red);box-shadow:0 2px 0 var(--red-deep)}
.lot{width:44px;height:44px;border-radius:12px;border:3px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.12);color:#fff;font-size:26px;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center;animation:arrow 1.6s ease-in-out infinite}
.cat{position:relative;width:62px;height:34px;padding:0;border:0;background:none;cursor:pointer;display:block;margin-bottom:-2px}
.cat svg{display:block;width:62px;height:33px;overflow:visible}
.cat .breath{transform-box:fill-box;transform-origin:50% 100%;animation:catBreathe 4.4s ease-in-out infinite}
.cat .tail{transform-box:fill-box;transform-origin:0% 100%;animation:catTail 6s ease-in-out infinite}
.zz{position:absolute;left:14px;top:-4px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 0 #4A1F12,1px 0 0 #4A1F12,-1px 0 0 #4A1F12,0 -1px 0 #4A1F12;opacity:0;animation:zz 3.3s ease-out infinite;pointer-events:none}
.zz.z2{font-size:14px;animation-delay:-1.1s}
.zz.z3{font-size:17px;animation-delay:-2.2s}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:var(--card);border-radius:20px;padding:8px;box-shadow:0 2px 0 var(--line)}
.month-nav .icon-btn{box-shadow:none;background:var(--bg)}
.month-nav .icon-btn:disabled{opacity:.35;cursor:default}
.m-title{display:flex;flex-direction:column;align-items:center;text-align:center}
.m-title b{font-size:19px}
.m-title span{font-size:13px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:8px}
.hist-card{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border:0;background:var(--card);border-radius:18px;padding:10px 14px;text-align:left;cursor:pointer;box-shadow:0 3px 0 var(--wood)}
.hist-card[aria-current="true"]{box-shadow:0 0 0 3px var(--red),0 3px 0 var(--wood)}
.hist-ic{width:44px;height:44px;border-radius:14px;background:var(--wood);display:grid;place-items:center;flex-shrink:0}
.hist-card b{font-size:17px;display:block}
.hist-card small{font-size:13px;color:var(--muted)}
.note{background:var(--card);border-radius:18px;padding:14px 16px;color:var(--muted);font-size:14px;border:2px dashed var(--chip)}
.me-badge{width:76px;height:76px;border-radius:24px;background:var(--wood);display:grid;place-items:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.timer-card .stats{width:100%;margin-top:4px}
.scene-label{position:absolute;top:12px;right:12px;z-index:2;border:0;background:var(--card);color:var(--ink);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;min-height:32px}
.scene.tall .scene-label{display:none}
.town-empty{align-self:center;margin:0 auto;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;transform:translateY(-10px)}

/* town items */
.ti{position:relative;flex-shrink:0;background:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.ti:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:6px}
.ti.sel::before{content:'';position:absolute;top:-30px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:12px solid #fff;border-bottom:0;animation:arrow .8s ease-in-out infinite;z-index:3}
.ti.sel{z-index:2;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 0 6px rgba(255,201,60,.95));animation:selPop .55s cubic-bezier(.3,1.6,.5,1),selGlow 2s ease-in-out .55s infinite}
.sway{display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.bloom{display:block;border-radius:50% 50% 50% 6px;transform:rotate(-45deg)}
.stem{display:block;width:4px;background:var(--stem)}
.plant.rare .bloom{box-shadow:0 0 0 4px rgba(255,255,255,.6)}
.plant.epic .bloom{box-shadow:0 0 14px 5px var(--lamp)}
.glint{position:absolute;top:-6px;right:-6px;width:8px;height:8px;background:#fff;border-radius:2px;animation:twinkle 1.6s ease-in-out infinite}
.glint.g2{top:6px;left:-8px;right:auto;animation-delay:-.8s}
.roof{display:block;width:0;height:0;border-style:solid;border-color:transparent}
.body{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;align-content:start;box-sizing:border-box;padding:7px 6px 0}
.win{display:block;height:7px;border-radius:2px;background:var(--lamp);animation:lights 4s ease-in-out infinite}
.door{position:absolute;bottom:0;left:50%;margin-left:-5px;width:10px;height:13px;border-radius:5px 5px 0 0;background:var(--ink)}
.chim{position:absolute;top:4px;right:6px;width:7px;height:14px;background:var(--ink)}
.chim i{position:absolute;top:-10px;left:-2px;width:10px;height:10px;border-radius:50%;background:#fff;animation:smoke 2.2s ease-out infinite}
.chim i+i{animation-delay:-1.1s}
.floors{display:flex;flex-direction:column;align-items:center}
.floor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:58px;height:22px;box-sizing:border-box;padding:7px 8px;border-bottom:2px solid rgba(0,0,0,.18)}
.floor .win{height:auto}
.floor.ghost{background:transparent;border:3px dashed rgba(255,255,255,.85);border-radius:4px;height:20px;margin-bottom:2px}
.pole{position:relative;width:2px;height:22px;background:var(--ink)}
.pole i{position:absolute;top:0;left:2px;width:15px;height:10px;background:var(--yellow);transform-origin:0 50%;animation:flag 1.2s ease-in-out infinite}
.site{margin-left:18px}
.crane{position:absolute;left:-18px;bottom:0;width:100px;pointer-events:none}
.mast{position:absolute;left:0;bottom:0;width:6px;height:100%;background:repeating-linear-gradient(45deg,var(--yellow) 0 6px,var(--yellow-deep) 6px 9px)}
.jib{position:absolute;left:-8px;top:0;width:96px;height:6px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 6px,var(--yellow-deep) 6px 9px)}
.cable{position:absolute;left:66px;top:6px;width:2px;height:20px;background:var(--ink);animation:hook 2.4s ease-in-out infinite}
.cable i{position:absolute;bottom:-9px;left:-8px;width:18px;height:9px;border-radius:2px}
.grow{animation:grow .9s cubic-bezier(.3,1.6,.5,1) both;transform-origin:50% 100%}
.rise{animation:rise .8s cubic-bezier(.3,1.5,.5,1) both;transform-origin:50% 100%}
.drop{animation:drop .7s cubic-bezier(.3,1.2,.5,1) both;transform-origin:50% 100%}

/* sections */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 0 10px}
h2{margin:0;font-size:20px;font-weight:600}
.sec-meta{font-size:14px;color:var(--muted)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:2px dashed var(--chip);border-radius:16px;padding:10px 12px;margin-bottom:10px;font-size:14px;color:var(--muted)}
.link-btn{border:0;background:none;color:var(--red-ink);font-weight:600;font-size:14px;cursor:pointer;min-height:36px;padding:0 6px}
.tasks{display:flex;flex-direction:column;gap:10px}

/* task cards */
.task{--c:var(--red);background:var(--card);border-radius:20px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 3px 0 var(--c)}
.task.done{box-shadow:0 2px 0 var(--line)}
.smash{width:48px;height:48px;flex-shrink:0;border-radius:50%;border:3px solid var(--c);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.smash svg{opacity:0;transition:opacity .15s}
.task.done .smash{background:var(--c)}
.task.done .smash svg{opacity:1}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t-title{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.task.done>.t-main .t-title,.task.big.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-sub{font-size:13px;color:var(--muted)}
.more{width:44px;height:44px;flex-shrink:0;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.menu{flex-basis:100%;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line)}
.menu span{margin-right:auto;font-size:14px;font-weight:500}
.btn-sm{min-height:40px;padding:0 14px;border-radius:12px;border:0;font-size:14px;font-weight:600;cursor:pointer;background:var(--bg)}
.btn-sm.danger{background:var(--red);color:#fff}
.task.big{flex-direction:column;align-items:stretch;gap:10px}
.big-head{display:flex;align-items:center;gap:12px}
.big-icon{width:48px;height:48px;flex-shrink:0;border-radius:14px;background:var(--c);display:grid;place-items:center}
.floorbar{display:flex;gap:4px}
.floorbar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.floorbar i.on{background:var(--c)}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;border:0;background:var(--bg);border-radius:14px;padding:6px 12px 6px 8px;text-align:left;cursor:pointer}
.step .dot{width:34px;height:34px;border-radius:10px;background:var(--chip);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.step.done .dot{background:var(--c)}
.step .s-text{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.step.done .s-text{text-decoration:line-through;color:var(--muted)}
.step.next{box-shadow:inset 0 0 0 2px var(--c);animation:pulse 1.8s ease-in-out infinite}
.s-coin{font-size:13px;font-weight:700;color:var(--gold-ink)}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.shake{animation:shake .45s ease-out}
.empty{background:var(--card);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 3px 0 var(--line)}
.empty b{font-size:18px}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}
.five{width:100%;height:60px;margin-top:16px;border:0;border-radius:20px;background:var(--red);color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 5px 0 var(--red-deep);animation:breathe 2.2s ease-in-out infinite}

/* town view */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{border-radius:16px;padding:10px 12px;color:#fff;display:flex;flex-direction:column}
.stat b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px}
.s-red{background:var(--red)}.s-green{background:var(--grass)}.s-purple{background:var(--purple)}
.detail{margin-top:14px;background:var(--card);border-radius:24px;padding:16px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 4px 0 var(--c,var(--red));animation:cardIn .35s cubic-bezier(.3,1.4,.5,1)}
.d-icon{width:56px;height:56px;border-radius:18px;background:var(--c);flex-shrink:0;display:grid;place-items:center}
.d-name{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;padding:3px 9px;border-radius:999px;background:var(--purple)}
.badge.epic{background:var(--gold-ink)}
.d-from{font-size:14px;color:var(--muted);margin-top:2px}
.d-from strong{color:var(--ink);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;font-weight:600;background:var(--bg);padding:4px 10px;border-radius:999px}
.pill.gold{background:#FFF0C2;color:var(--gold-ink)}
.town-hint{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 0}
.cta{width:100%;height:58px;border:0;border-radius:20px;background:var(--red);color:#fff;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 5px 0 var(--red-deep)}
.cta.small{height:46px;font-size:15px;border-radius:14px;margin-top:10px;box-shadow:0 4px 0 var(--red-deep)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
.nav-b{min-width:76px;min-height:50px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.nav-b[aria-current="page"]{color:var(--red-ink);font-weight:700}
.add-fab{width:64px;height:64px;margin-top:-30px;border-radius:50%;border:4px solid var(--bg);background:var(--red);display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 var(--red-deep)}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.fx-ring{position:fixed;width:48px;height:48px;margin:-24px 0 0 -24px;border:4px solid;border-radius:50%;animation:ring .6s ease-out forwards}
.fx-bit{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;animation:fly .8s cubic-bezier(.15,.8,.35,1) forwards}
.fx-coin{position:fixed;font-weight:700;font-size:22px;color:var(--ink);background:var(--yellow);padding:2px 12px;border-radius:999px;animation:floatUp 1s ease-out forwards;white-space:nowrap}
.fx-flash{position:fixed;inset:0;animation:flash .5s ease-out forwards}
.fx-big{position:fixed;left:50%;top:40%;font-size:58px;font-weight:700;color:#fff;padding:8px 26px;border-radius:28px;box-shadow:0 8px 0 var(--ink);white-space:nowrap;animation:bigSmash 1.15s cubic-bezier(.3,1.4,.5,1) forwards}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-size:15px;box-sizing:border-box;animation:toastIn .35s cubic-bezier(.3,1.4,.5,1) both}
.toast b{color:var(--lamp)}

/* sheet + timer */
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding-inline:16px}
.backdrop{position:absolute;inset:0;background:rgba(42,20,20,.5);animation:fadeIn .25s both}
.sheet{position:relative;width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding-inline:16px;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:sheetUp .35s cubic-bezier(.3,1.2,.5,1) both}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:14px;font-weight:600;color:var(--muted)}
.field{height:56px;border-radius:18px;border:3px solid var(--red);background:var(--card);padding:0 16px;font-size:18px;font-weight:500;color:var(--ink);box-sizing:border-box;width:100%;font-family:inherit}
.switch-row{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 0 var(--line)}
.switch-row>div{flex:1}
.sw-title{font-size:17px;font-weight:600}
.sw-sub{font-size:13px;color:var(--muted)}
.switch{width:64px;height:38px;flex-shrink:0;border-radius:999px;border:0;background:var(--chip);position:relative;cursor:pointer;padding:0;transition:background .2s}
.switch[aria-checked="true"]{background:var(--red)}
.knob{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.switch[aria-checked="true"] .knob{transform:translateX(26px)}
.hint{border-radius:20px;padding:14px 16px;color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;gap:14px}
.hint.green{background:var(--grass)}
.hint.blue{background:var(--blue)}
.steps-in{display:flex;flex-direction:column;gap:8px;animation:cardIn .35s cubic-bezier(.3,1.4,.5,1)}
.step-in{display:flex;align-items:center;gap:8px}
.step-in .dot{width:34px;height:34px;flex-shrink:0;border-radius:10px;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.step-in input{flex:1;min-width:0;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;font-family:inherit;color:var(--ink);box-sizing:border-box}
.rm{width:40px;height:40px;flex-shrink:0;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.add-step{height:44px;border-radius:14px;border:2px dashed var(--red);background:transparent;color:var(--red-ink);font-size:15px;font-weight:600;cursor:pointer}
.err{margin:0;color:var(--red-ink);font-size:14px;font-weight:600;min-height:1em}
.timer-card{position:relative;width:100%;max-width:360px;background:var(--bg);border-radius:28px;padding:22px 18px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:cardIn .35s cubic-bezier(.3,1.4,.5,1) both}
.timer-card p{margin:0;color:var(--muted);font-size:15px;max-width:28ch}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:16}
.ring .prog{fill:none;stroke:var(--red);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.t-num{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.t-btns{display:flex;flex-direction:column;gap:8px;width:100%}
.ghost{height:46px;border:0;background:none;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer}

@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes grow{0%{transform:scale(0) translateY(20px)}55%{transform:scale(1.45) translateY(-6px)}75%{transform:scale(.88)}90%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes rise{0%{transform:scaleY(0)}55%{transform:scaleY(1.18)}75%{transform:scaleY(.94)}90%{transform:scaleY(1.04)}100%{transform:scaleY(1)}}
@keyframes drop{0%{transform:translateY(-120px);opacity:0}15%{opacity:1}60%{transform:translateY(5px) scale(1.06,.9)}80%{transform:translateY(-3px) scale(.98,1.03)}100%{transform:none}}
@keyframes drift{0%{transform:translateX(-110px)}100%{transform:translateX(520px)}}
@keyframes sun{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:rotate(45deg) scale(.3)}50%{opacity:1;transform:rotate(45deg) scale(1)}}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(70px,-18px)}50%{transform:translate(150px,6px)}75%{transform:translate(80px,-26px)}100%{transform:translate(0,0)}}
@keyframes wing{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
@keyframes lights{0%,100%{background:var(--lamp)}45%{background:#FFF6CF}50%{background:#FFB938}}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.9}100%{transform:translate(8px,-26px) scale(1.4);opacity:0}}
@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-12deg)}}
@keyframes hook{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes arrow{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.7)}60%{transform:scale(1.35)}80%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-1deg)}40%{transform:translateX(6px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 2px var(--c)}50%{box-shadow:inset 0 0 0 2px var(--c),0 0 0 5px rgba(232,38,58,.14)}}
@keyframes breathe{0%,100%{transform:translateY(0);box-shadow:0 5px 0 var(--red-deep)}50%{transform:translateY(-2px);box-shadow:0 7px 0 var(--red-deep)}}
@keyframes coinBump{0%,100%{transform:scale(1)}40%{transform:scale(1.25) rotate(-6deg)}}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.8);opacity:0}}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(240deg);opacity:0}}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{transform:translate(-50%,-70%) scale(1.25);opacity:1}100%{transform:translate(-50%,-260%) scale(1);opacity:0}}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
@keyframes bigSmash{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}35%{transform:translate(-50%,-50%) scale(1.2) rotate(4deg);opacity:1}55%{transform:translate(-50%,-50%) scale(.95) rotate(-2deg)}70%{transform:translate(-50%,-50%) scale(1.04)}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
@keyframes toastIn{0%{transform:translate(-50%,30px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
@keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
@keyframes cardIn{0%{transform:translateY(16px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes selPop{0%{transform:scale(1)}35%{transform:scale(.9,1.08)}65%{transform:scale(1.08,.95)}100%{transform:scale(1)}}
@keyframes selGlow{
  0%,100%{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 0 4px rgba(255,201,60,.8))}
  50%{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 0 12px rgba(255,201,60,1))}
}
@keyframes catBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.07)}}
@keyframes catTail{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-6deg)}}
@keyframes zz{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(-10px,-30px) scale(1.1) rotate(-12deg);opacity:0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="date" id="date"></div>
      <h1 id="h1">Today</h1>
    </div>
    <div class="top-r">
      <button class="icon-btn" id="soundBtn" data-act="sound" aria-label="Sound is on. Turn sound off"></button>
      <div class="coins" id="coins" aria-label="Coins">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#FF8A1F"></circle><circle cx="13" cy="13" r="8" fill="none" stroke="#FFE08A" stroke-width="2.5"></circle></svg>
        <span id="coinN">0</span>
      </div>
    </div>
  </header>

  <section class="scene" id="scene" aria-label="Your town">
    <svg class="rays" viewBox="0 0 92 92" aria-hidden="true"><g stroke="#FFE08A" stroke-width="4" stroke-linecap="round"><path d="M46 4v12M46 76v12M4 46h12M76 46h12M16 16l8 8M68 68l8 8M16 76l8-8M68 24l8-8"></path></g></svg>
    <div class="sun" aria-hidden="true"></div>
    <div class="cloud" style="top:22px;width:74px;height:22px;background:var(--cloud);animation-duration:17s" aria-hidden="true"></div>
    <div class="cloud" style="top:58px;width:48px;height:16px;background:var(--cloud2);animation-duration:25s;animation-delay:-11s" aria-hidden="true"></div>
    <div class="spark" style="top:40px;right:50px" aria-hidden="true"></div>
    <div class="spark" style="top:84px;right:130px;background:var(--lamp);animation-delay:-1.2s" aria-hidden="true"></div>
    <div class="fly" aria-hidden="true"><i></i><i></i></div>
    <div class="hill" aria-hidden="true"></div>
    <div class="scroller" id="scroller"><div class="row" id="row"></div></div>
    <button class="scene-label" id="sceneLabel" data-act="go-town"></button>
  </section>

  <main id="view"></main>
</div>

<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <button class="nav-b" id="navToday" data-act="view" data-v="today">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"></rect><path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg>
      Today
    </button>
    <button class="add-fab" data-act="open-sheet" aria-label="Add a task">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="3" stroke-linecap="round"></path></svg>
    </button>
    <button class="nav-b" id="navTown" data-act="view" data-v="town">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l5-4 5 4v11M15 21V13h4v8M9 21v-4h2v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path></svg>
      Town
    </button>
  </div>
</nav>

<div id="fx" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="sheet" hidden>
  <div class="backdrop" data-act="close-sheet"></div>
  <form class="sheet" id="addForm" aria-labelledby="sheetTitle" novalidate>
    <div class="sheet-head">
      <h2 id="sheetTitle">New task</h2>
      <button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path></svg>
      </button>
    </div>
    <label class="lbl" for="tTitle">What do you want to do?</label>
    <input class="field" id="tTitle" maxlength="80" autocomplete="off" placeholder="e.g. Reply to one client">
    <div class="switch-row">
      <div>
        <div class="sw-title">Break it into tiny steps</div>
        <div class="sw-sub">Optional · each step builds a floor</div>
      </div>
      <button type="button" class="switch" id="bdSwitch" role="switch" aria-checked="false" aria-label="Break it into tiny steps" data-act="switch"><span class="knob"></span></button>
    </div>
    <div class="hint green" id="quickHint">
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 4c8 0 13 5 13 12-6 0-13-2-13-12zM17 4C9 4 4 9 4 16c6 0 13-2 13-12z" fill="#E8263A"></path><path d="M17 12v30" stroke="#0B6E3B" stroke-width="4"></path></svg>
      <span>Quick task: one smash grows a surprise in your town</span>
    </div>
    <div id="stepsBox" class="steps-in" hidden>
      <div id="stepsList" class="steps-in"></div>
      <button type="button" class="add-step" id="addStepBtn" data-act="add-step">+ Add a tiny step</button>
      <div class="hint blue" id="floorsHint"></div>
    </div>
    <p class="err" id="formErr" role="alert"></p>
    <button type="submit" class="cta" id="addCta">Add to my town</button>
  </form>
</div>

<div class="overlay center" id="timer" hidden>
  <div class="backdrop" data-act="close-timer"></div>
  <div class="timer-card" role="dialog" aria-labelledby="tHead">
    <h2 id="tHead">Just 5 minutes</h2>
    <p id="tMsg">Start anything. When the ring runs out, you are allowed to stop.</p>
    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="86"></circle><circle class="prog" id="tProg" cx="100" cy="100" r="86" stroke-dasharray="540.35" stroke-dashoffset="0"></circle></svg>
      <div class="t-num" id="tNum">5:00</div>
    </div>
    <div class="t-btns">
      <button class="cta" id="tGo" data-act="t-go">Start</button>
      <button class="ghost" data-act="close-timer">Close</button>
    </div>
  </div>
</div>

<div class="overlay center" id="monthEnd" hidden>
  <div class="backdrop" data-act="close-month"></div>
  <div class="timer-card" role="dialog" aria-labelledby="meHead">
    <div class="me-badge" id="meBadge"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l5-4 5 4v11M15 21V13h4v8M9 21v-4h2v4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"></path></svg></div>
    <h2 id="meHead"></h2>
    <p id="meMsg"></p>
    <div class="stats" id="meStats"></div>
    <div class="t-btns">
      <button class="cta" id="meSee" data-act="see-month"></button>
      <button class="ghost" id="meStart" data-act="close-month"></button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var PAL=['#E8263A','#FF8A1F','#FFC93C','#13B5A6','#7B4BE0','#FF5FA2','#2F7DF6'];
var TASKC=['#E8263A','#FF8A1F','#13B5A6','#7B4BE0','#FF5FA2','#2F7DF6'];
var CNAME={'#E8263A':'Red','#FF8A1F':'Orange','#FFC93C':'Sunny','#13B5A6':'Teal','#7B4BE0':'Purple','#FF5FA2':'Pink','#2F7DF6':'Blue'};
var ROOF={'#E8263A':'#8E0B20','#FF8A1F':'#C24A00','#FFC93C':'#C78A00','#13B5A6':'#0B7A6E','#7B4BE0':'#4A2A99','#FF5FA2':'#B8306E','#2F7DF6':'#1A4FA8'};
var CONF=['#E8263A','#FFC93C','#7B4BE0','#13B5A6','#FF8A1F','#FF5FA2','#2F7DF6','#FFFFFF'];
var R={quick:10,step:5,build:25,timer:5};
var LS='smashtown.v1';
var MAX_STEPS=6;
var CHECK='<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 11.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
var CHECK_S='<svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 11.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
var DOTS='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2" fill="currentColor"></circle><circle cx="12" cy="12" r="2.2" fill="currentColor"></circle><circle cx="19" cy="12" r="2.2" fill="currentColor"></circle></svg>';
var CRANE='<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V3M3 21h6M5 4h16M5 8l4-4M17 4v6M15 10h4v4h-4z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path></svg>';
var HOUSE='<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l5-4 5 4v11M15 21V13h4v8M9 21v-4h2v4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"></path></svg>';
var FLOWER='<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8M12 13c0-4 3-7 7-7 0 4-3 7-7 7zM12 15c0-3-2.5-5.5-6-5.5 0 3 2.5 5.5 6 5.5z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"></path></svg>';
var SOUND_ON='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"></path><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>';
var SOUND_OFF='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"></path><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>';

function $(id){return document.getElementById(id)}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthKey(d){return dayKey(d).slice(0,7)}
function monthDate(mk,day){var p=mk.split('-');return new Date(+p[0],+p[1]-1,day||1)}
function monthLabel(mk){return monthDate(mk).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function monthName(mk){return monthDate(mk).toLocaleDateString(undefined,{month:'long'})}
function daysInMonth(mk){var p=mk.split('-');return new Date(+p[0],+p[1],0).getDate()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

/* ---------- looks ---------- */
function quickLook(){
  if(Math.random()<0.3){var c=rnd(PAL);return{type:'house',color:c,roof:ROOF[c],rarity:'common',name:CNAME[c]+' '+rnd(['House','Cottage','Cabin','Loft']),w:38+Math.floor(Math.random()*16),h:36+Math.floor(Math.random()*24),chimney:Math.random()<0.5}}
  var x=Math.random();
  if(x<0.06)return{type:'plant',rarity:'epic',color:'#FFC93C',name:rnd(['Golden Rose','Star Bloom']),size:30,stem:30};
  if(x<0.26){var p=rnd([['Fire Tulip','#E8263A'],['Moon Lily','#7B4BE0'],['Coral Bloom','#FF5FA2'],['Ruby Rose','#C8102E']]);return{type:'plant',rarity:'rare',color:p[1],name:p[0],size:26,stem:26}}
  return{type:'plant',rarity:'common',color:rnd(['#E8263A','#FF8A1F','#FFC93C','#FF5FA2','#7B4BE0','#FFFFFF']),name:rnd(['Daisy','Tulip','Poppy','Sunflower','Bluebell','Peony']),size:16+Math.floor(Math.random()*8),stem:12+Math.floor(Math.random()*14)};
}
function bigLook(){var c=rnd(PAL);return{color:c,roof:ROOF[c],peak:Math.random()<0.5,name:CNAME[c]+' '+rnd(['Tower','Hall','Studio','Heights'])}}

/* ---------- state ---------- */
function blank(){return{v:1,tasks:[],bonus:0,sound:true,updatedAt:0}}
var S=blank();
try{var raw=localStorage.getItem(LS);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.tasks))S=Object.assign(blank(),p)}}catch(e){}
var ui={view:'today',sel:null,menu:null,confirmDel:null,justAdded:null,justDone:null,justStepTask:null,coinBump:false};
var dbRef=null,saveT=null;

function persist(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(dbRef){clearTimeout(saveT);saveT=setTimeout(function(){dbRef.set(clone(S)).catch(function(){})},350)}
}
function commit(){persist();render()}

(function connect(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    window.claude.use('db').then(function(db){
      if(!db)return;
      dbRef=db.doc('app/state');
      dbRef.onSnapshot(function(snap){
        if(!snap.exists){if(S.tasks.length||S.bonus)dbRef.set(clone(S)).catch(function(){});return}
        if(snap.metadata&&snap.metadata.hasPendingWrites)return;
        var d=snap.data();
        if(d&&Array.isArray(d.tasks)&&(d.updatedAt||0)>(S.updatedAt||0)){
          S=Object.assign(blank(),clone(d));
          try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
          render();checkMonth(townItems());
        }
      },function(){});
    }).catch(function(){});
  }catch(e){}
})();

function find(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i];return null}
function coins(){var c=S.bonus||0;S.tasks.forEach(function(t){if(t.kind==='quick'){if(t.done)c+=R.quick}else{t.steps.forEach(function(s){if(s.done)c+=R.step});if(t.done)c+=R.build}});return c}
function townItems(){
  var out=[];
  S.tasks.forEach(function(t){
    var dk;
    if(t.kind==='quick'){if(t.done){dk=dayKey(new Date(t.doneAt));out.push({id:t.id,at:t.doneAt,kind:t.look.type,look:t.look,task:t.title,reward:R.quick,day:t.doneAt,dk:dk,mk:dk.slice(0,7)})}}
    else{
      /* unfinished towers always stand on today's plot; finished ones stay on the day they were completed */
      var b=t.steps.filter(function(s){return s.done}).length;dk=t.done?dayKey(new Date(t.doneAt)):dayKey();
      out.push({id:t.id,at:t.done?t.doneAt:Date.now(),kind:t.done?'tower':'site',look:t.look,task:t.title,built:b,total:t.steps.length,reward:b*R.step+(t.done?R.build:0),day:t.doneAt||t.createdAt,dk:dk,mk:dk.slice(0,7)});
    }
  });
  return out.sort(function(a,b){return a.at-b.at});
}

/* ---------- sound + haptics ---------- */
var AC=null;
function ctx(){if(!S.sound)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function tone(c,type,f1,f2,t0,dur,vol){var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f1,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(0.0001,c.currentTime);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+0.02)}
function noise(c,t0,dur,freq,vol){var len=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);var s=c.createBufferSource();s.buffer=buf;var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;var g=c.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t0)}
/* soft mallet note: gentle attack, warm decay, a quiet overtone, through a low-pass so nothing is harsh */
function mallet(c,dest,f,t0,vol,dur){
  [[1,1],[2.01,.28],[3.98,.08]].forEach(function(h){
    var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*h[0];
    var v=vol*h[1],d=dur/(h[0]>1?h[0]*.8:1);
    g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(v,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+d+.05);
  });
}
function selectSound(kind){
  vib(8);var c=ctx();if(!c)return;var n=c.currentTime+.01;
  var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.Q.value=.4;lp.connect(c.destination);
  /* a soft bubble "bloop" first */
  var b=c.createOscillator(),bg=c.createGain();b.type='sine';
  b.frequency.setValueAtTime(260,n);b.frequency.exponentialRampToValueAtTime(620,n+.07);
  bg.gain.setValueAtTime(0.0001,n);bg.gain.linearRampToValueAtTime(.16,n+.015);bg.gain.exponentialRampToValueAtTime(0.0001,n+.14);
  b.connect(bg);bg.connect(lp);b.start(n);b.stop(n+.16);
  /* then a two-note chime: plants sparkle high, houses sit in the middle, towers ring low and full */
  var notes=kind==='plant'?[1046.5,1568]:(kind==='house'?[784,1174.7]:[523.25,784,1046.5]);
  notes.forEach(function(f,i){mallet(c,lp,f,n+.05+i*.075,.2-i*.03,.9)});
}
var sfx={
  smash:function(){vib([25,30,70]);var c=ctx();if(!c)return;var n=c.currentTime;noise(c,n,.18,2200,.5);tone(c,'sine',320,60,n,.25,.6);tone(c,'triangle',880,0,n+.08,.3,.22);tone(c,'triangle',1320,0,n+.16,.35,.2)},
  step:function(){vib([20,40,60]);var c=ctx();if(!c)return;var n=c.currentTime;tone(c,'sine',180,45,n,.28,.7);noise(c,n,.12,900,.35);tone(c,'triangle',880,0,n+.1,.3,.22)},
  build:function(){vib([40,40,40,40,140]);var c=ctx();if(!c)return;var n=c.currentTime;tone(c,'sine',180,45,n,.3,.7);noise(c,n,.2,1400,.45);[660,880,1100,1320,1760].forEach(function(f,i){tone(c,'triangle',f,0,n+.1+i*.1,.4,.22)})},
  ding:function(){vib(12);var c=ctx();if(!c)return;var n=c.currentTime;tone(c,'triangle',660,990,n,.25,.25)},
  undo:function(){var c=ctx();if(!c)return;var n=c.currentTime;tone(c,'sine',520,260,n,.2,.25)},
  tap:function(){vib(10);var c=ctx();if(!c)return;tone(c,'triangle',540,0,c.currentTime,.08,.15)}
};

/* ---------- effects ---------- */
function burst(el,color,o){
  o=o||{};var fx=$('fx');var r=el.getBoundingClientRect();var x=r.left+r.width/2,y=r.top+r.height/2;var made=[];
  function add(cls,css,txt){var d=document.createElement('div');d.className=cls;d.style.cssText=css;if(txt)d.textContent=txt;fx.appendChild(d);made.push(d);return d}
  if(!reduce){
    add('fx-ring','left:'+x+'px;top:'+y+'px;border-color:'+color);
    var n=o.big?30:14;
    for(var i=0;i<n;i++){var a=i/n*Math.PI*2+Math.random()*.4,dist=(o.big?110:46)+Math.random()*(o.big?130:40);
      add('fx-bit','left:'+x+'px;top:'+y+'px;background:'+CONF[i%CONF.length]+';border-radius:'+(i%2?'50%':'3px')+';--dx:'+Math.round(Math.cos(a)*dist)+'px;--dy:'+Math.round(Math.sin(a)*dist+(o.big?50:0))+'px')}
  }
  if(o.coins)add('fx-coin','left:'+x+'px;top:'+(y-6)+'px',o.coins);
  if(o.text){add('fx-flash','background:'+color);add('fx-big','background:'+color,o.text)}
  setTimeout(function(){made.forEach(function(d){d.remove()})},1300);
}
var toastT=null;
function toast(html){var t=$('toast');t.innerHTML=html;t.hidden=false;t.style.animation='none';void t.offsetWidth;t.style.animation='';clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2800)}
function scrollToItem(id){var s=$('scroller'),el=$('row').querySelector('[data-id="'+id+'"]');if(!el)return;var sr=s.getBoundingClientRect(),er=el.getBoundingClientRect();var target=s.scrollLeft+(er.left+er.width/2)-(sr.left+sr.width/2);try{s.scrollTo({left:target,behavior:reduce?'auto':'smooth'})}catch(e){s.scrollLeft=target}}
function scrollTownEnd(){var s=$('scroller');setTimeout(function(){try{s.scrollTo({left:s.scrollWidth,behavior:reduce?'auto':'smooth'})}catch(e){s.scrollLeft=s.scrollWidth}},60)}

/* ---------- town rendering ---------- */
function wins(n,i){var h='';for(var k=0;k<n;k++)h+='<i class="win" style="animation-delay:-'+((i*1.3+k*.7)%4).toFixed(2)+'s"></i>';return h}
function floorHTML(color,i,k,drop){return '<span class="floor'+(drop?' drop':'')+'" style="background:'+color+'"><i class="win" style="animation-delay:-'+((i+k)%4)+'s"></i><i class="win" style="animation-delay:-'+((i+k+1.3)%4).toFixed(1)+'s"></i><i class="win" style="animation-delay:-'+((i+k+2.6)%4).toFixed(1)+'s"></i></span>'}
function itemHTML(it,i){
  var L=it.look,sel=ui.sel===it.id?' sel':'',lab=esc(L.name)+(it.kind==='site'?', under construction':'');
  var head='data-act="pick" data-id="'+it.id+'" aria-label="'+lab+'"';
  if(it.kind==='plant'){
    var anim=ui.justAdded===it.id?' grow':'';
    return '<button class="ti plant '+L.rarity+sel+anim+'" '+head+'><span class="sway" style="animation-delay:-'+((i*.37)%3).toFixed(2)+'s"><span class="bloom" style="width:'+L.size+'px;height:'+L.size+'px;background:'+L.color+'"></span><span class="stem" style="height:'+L.stem+'px"></span></span>'+(L.rarity==='epic'?'<span class="glint"></span><span class="glint g2"></span>':'')+'</button>';
  }
  if(it.kind==='house'){
    var an=ui.justAdded===it.id?' rise':'';var rows=Math.max(1,Math.floor((L.h-20)/13));
    return '<button class="ti house'+sel+an+'" '+head+'>'+(L.chimney?'<span class="chim"><i></i><i></i></span>':'')+'<span class="roof" style="border-width:0 '+(L.w/2+4)+'px 18px;border-bottom-color:'+L.roof+'"></span><span class="body" style="width:'+L.w+'px;height:'+L.h+'px;background:'+L.color+'">'+wins(rows*2,i)+'<span class="door"></span></span></button>';
  }
  var drop=ui.justStepTask===it.id,f='',k;
  if(it.kind==='tower'){
    for(k=it.total-1;k>=0;k--)f+=floorHTML(L.color,i,k,false);
    var top=L.peak?'<span class="roof'+(drop?' drop':'')+'" style="border-width:0 34px 18px;border-bottom-color:'+L.roof+'"></span>':'<span class="pole'+(drop?' drop':'')+'"><i></i></span>';
    return '<button class="ti tower'+sel+'" '+head+'>'+top+'<span class="floors">'+f+'</span></button>';
  }
  for(k=it.total-1;k>=0;k--)f+=(k<it.built)?floorHTML(L.color,i,k,drop&&k===it.built-1):'<span class="floor ghost"></span>';
  var ch=it.total*22+34;
  return '<button class="ti site'+sel+'" '+head+'><span class="crane" style="height:'+ch+'px"><span class="mast"></span><span class="jib"></span><span class="cable"><i style="background:'+L.color+'"></i></span></span><span class="floors">'+f+'</span></button>';
}

var lastRow='',lastMk='';
function renderTown(items,mk){
  var cur=monthKey(),td=dayKey(),last=mk===cur?new Date().getDate():daysInMonth(mk);
  var mi=items.filter(function(x){return x.mk===mk});
  var by={};mi.forEach(function(x){(by[x.dk]=by[x.dk]||[]).push(x)});
  var html='',gi=0;
  for(var d=1;d<=last;d++){
    var dk=mk+'-'+String(d).padStart(2,'0'),list=by[dk]||[],isT=dk===td;
    var wd=monthDate(mk,d).toLocaleDateString(undefined,{weekday:'short'});
    var inner=list.length?list.map(function(x){return itemHTML(x,gi++)}).join(''):(isT?'<button class="lot" data-act="open-sheet" aria-label="Add a task for today">+</button>':catHTML(dk,d));
    html+='<div class="plot'+(isT?' today':'')+'">'+inner+'<span class="sign">'+(isT?'Today':esc(wd)+' '+d)+'</span></div>';
  }

function monthsList(items){var cur=monthKey(),set={};set[cur]=1;items.forEach(function(x){set[x.mk]=1});return Object.keys(set).sort().reverse()}
function monthStats(mi){var b=mi.filter(function(x){return x.kind!=='plant'}).length;return{b:b,p:mi.length-b,r:mi.filter(function(x){return x.look.rarity==='rare'||x.look.rarity==='epic'}).length}}

/* ---------- today view ---------- */
function quickHTML(t){
  var pop=ui.justDone===t.id?' pop':'';
  var sub=t.done?'Smashed! '+esc(t.look.name)+' joined your town':'+'+R.quick+' coins · a surprise for your town';
  return '<div class="task'+(t.done?' done':'')+'" style="--c:'+t.color+'">'+
    '<button class="smash'+pop+'" data-act="toggle" data-id="'+t.id+'" aria-pressed="'+(t.done?'true':'false')+'" aria-label="'+(t.done?'Undo: ':'Smash: ')+esc(t.title)+'">'+CHECK+'</button>'+
    '<div class="t-main"><div class="t-title">'+esc(t.title)+'</div><div class="t-sub">'+sub+'</div></div>'+
    '<button class="more" data-act="menu" data-id="'+t.id+'" aria-expanded="'+(ui.menu===t.id)+'" aria-label="Options for '+esc(t.title)+'">'+DOTS+'</button>'+menuHTML(t)+'</div>';
}
function bigHTML(t){
  var b=t.steps.filter(function(s){return s.done}).length,n=t.steps.length,next=-1;
  for(var k=0;k<n;k++)if(!t.steps[k].done){next=k;break}
  var bar=t.steps.map(function(s){return '<i class="'+(s.done?'on':'')+'"></i>'}).join('');
  var steps=t.steps.map(function(s,k){
    var pop=ui.justDone===s.id?' pop':'';
    return '<button class="step'+(s.done?' done':'')+(k===next?' next':'')+pop+'" data-act="step" data-id="'+t.id+'" data-sid="'+s.id+'" aria-pressed="'+(s.done?'true':'false')+'" aria-label="'+(s.done?'Undo floor ':'Build floor ')+(k+1)+': '+esc(s.text)+'"><span class="dot">'+(s.done?CHECK_S:'F'+(k+1))+'</span><span class="s-text">'+esc(s.text)+'</span><span class="s-coin">+'+R.step+'</span></button>';
  }).join('');
  var sub=t.done?'Built! '+esc(t.look.name)+' stands in your town':b+' of '+n+' floors · '+esc(t.look.name);
  return '<div class="task big'+(t.done?' done':'')+'" style="--c:'+t.look.color+'">'+
    '<div class="big-head"><span class="big-icon">'+(t.done?HOUSE:CRANE)+'</span><div class="t-main"><div class="t-title">'+esc(t.title)+'</div><div class="t-sub">'+sub+'</div></div>'+
    '<button class="more" data-act="menu" data-id="'+t.id+'" aria-expanded="'+(ui.menu===t.id)+'" aria-label="Options for '+esc(t.title)+'">'+DOTS+'</button></div>'+
    '<div class="floorbar" aria-hidden="true">'+bar+'</div><div class="steps">'+steps+'</div>'+menuHTML(t)+'</div>';
}
function menuHTML(t){
  if(ui.menu!==t.id)return '';
  var tower=t.kind==='big'&&!t.done;
  if(ui.confirmDel===t.id)return tower
    ?'<div class="menu"><span>Cancel this tower? The whole building and all its floors will be removed.</span><button class="btn-sm" data-act="del-no">Keep building</button><button class="btn-sm danger" data-act="del-yes" data-id="'+t.id+'">Remove tower</button></div>'
    :'<div class="menu"><span>Delete it and its spot in town?</span><button class="btn-sm" data-act="del-no">Keep</button><button class="btn-sm danger" data-act="del-yes" data-id="'+t.id+'">Delete</button></div>';
  return '<div class="menu"><button class="btn-sm" data-act="menu" data-id="'+t.id+'">Close</button><button class="btn-sm danger" data-act="del" data-id="'+t.id+'">'+(tower?'Cancel tower':'Delete task')+'</button></div>';

function renderToday(){
  var td=dayKey();

  list.sort(function(a,b){if(a.done!==b.done)return a.done?1:-1;return a.createdAt-b.createdAt});
  var doneToday=0;S.tasks.forEach(function(t){if(t.kind==='quick'&&t.done&&t.doneDay===td)doneToday++;if(t.kind==='big')t.steps.forEach(function(s){if(s.done&&s.doneAt&&dayKey(new Date(s.doneAt))===td)doneToday++})});

  h+='<button class="five" data-act="five"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="#fff" stroke-width="2.5"></circle><path d="M12 9v4l2.5 2M9 2h6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"></path></svg>Just 5 minutes</button>';

/* ---------- town view ---------- */
function fmtDay(ts){if(!ts)return '';var d=new Date(ts);if(dayKey(d)===dayKey())return 'Today';return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
var ARROW_L='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
var ARROW_R='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
function statsHTML(st){return '<div class="stat s-red"><b>'+st.b+'</b><span>buildings</span></div><div class="stat s-green"><b>'+st.p+'</b><span>plants</span></div><div class="stat s-purple"><b>'+st.r+'</b><span>rare finds</span></div>'}
function renderTownView(all){
  var cur=monthKey(),months=monthsList(all),mk=ui.month||cur;
  if(months.indexOf(mk)<0){mk=cur;ui.month=cur}

    '<button class="icon-btn" data-act="month" data-m="'+newer+'" aria-label="Newer month"'+(newer?'':' disabled')+'>'+ARROW_R+'</button></div>';
  h+='<div class="stats">'+statsHTML(monthStats(items))+'</div>';

    if(it.kind==='tower')pills+='<span class="pill">'+it.total+' floors</span>';
    h+='<div class="detail" style="--c:'+c+'"><span class="d-icon">'+icon+'</span><div class="t-main"><div class="d-name">'+esc(L.name)+badge+'</div><div class="d-from">'+verb+': <strong>'+esc(it.task)+'</strong></div><div class="pills">'+pills+'</div>'+(it.kind==='site'?'<button class="cta small" data-act="go-build" data-id="'+it.id+'">Build the next floor</button>':'')+'</div></div>';
  } else {
    h+='<div class="empty" style="margin-top:14px"><b>Nothing built yet this month</b><p>Every task you smash adds a flower, a house, or a whole tower to today\'s plot.</p><button class="cta small" data-act="open-sheet">Add a task</button></div>';
  }

  h+='<div class="sec-head"><h2>Town history</h2><span class="sec-meta">'+past.length+(past.length===1?' month':' months')+'</span></div>';
  if(past.length){
    h+='<div class="hist">'+past.map(function(m){var st=monthStats(all.filter(function(x){return x.mk===m}));
      return '<button class="hist-card" data-act="month" data-m="'+m+'" aria-current="'+(m===mk)+'"><span class="hist-ic">'+HOUSE+'</span><span class="t-main"><b>'+esc(monthLabel(m))+'</b><small>'+st.b+' buildings · '+st.p+' plants · '+st.r+' rare</small></span>'+ARROW_R+'</button>'}).join('')+'</div>';
  } else h+='<div class="note">Each month your town is kept here, and the next month starts on fresh, empty land. Unfinished towers move with you.</div>';

function showMonthEnd(mk,mi){
  var st=monthStats(mi),nm=monthName(monthKey());
  $('meHead').textContent=monthName(mk)+' Town is complete!';
  $('meMsg').textContent='Look at everything you built. It is saved in Town history, and '+nm+' starts on fresh land.';
  $('meStats').innerHTML=statsHTML(st);
  $('meSee').textContent='See my '+monthName(mk)+' town';$('meSee').dataset.m=mk;
  $('meStart').textContent='Start '+nm;
  $('monthEnd').hidden=false;
  setTimeout(function(){burst($('meBadge'),'#9A5B2E',{big:true})},250);
}
function checkMonth(items){
  var cur=monthKey();
  if(!S.lastMonth){S.lastMonth=cur;return}
  if(S.lastMonth!==cur){var prev=S.lastMonth;S.lastMonth=cur;persist();var mi=items.filter(function(x){return x.mk===prev&&x.kind!=='site'});if(mi.length)showMonthEnd(prev,mi)}
}

/* ---------- render ---------- */
var clearT=null;
function render(){
  var items=townItems();
  $('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  $('h1').textContent=ui.view==='town'?'My Town':'Today';
  var cn=$('coinN'),nc=String(coins());
  if(cn.textContent!==nc){cn.textContent=nc;if(ui.coinBump){var cb=$('coins');cb.classList.remove('bump');void cb.offsetWidth;cb.classList.add('bump')}}
  $('coins').setAttribute('aria-label',nc+' coins');
  $('soundBtn').innerHTML=S.sound?SOUND_ON:SOUND_OFF;
  $('soundBtn').setAttribute('aria-label',S.sound?'Sound is on. Turn sound off':'Sound is off. Turn sound on');
  $('scene').classList.toggle('tall',ui.view==='town');
  if(ui.view!=='town'&&ui.sel){ui.sel=null}
  if(ui.view==='town')renderTownView(items);else renderToday();
  renderTown(items,ui.view==='town'?(ui.month||monthKey()):monthKey());
  $('navToday').setAttribute('aria-current',ui.view==='today'?'page':'false');
  $('navTown').setAttribute('aria-current',ui.view==='town'?'page':'false');
  clearTimeout(clearT);
  clearT=setTimeout(function(){ui.justAdded=null;ui.justDone=null;ui.justStepTask=null;ui.coinBump=false},950);
}

/* ---------- actions ---------- */
var act={
  toggle:function(b,id){
    var t=find(id);if(!t)return;
    if(!t.done){
      t.done=true;t.doneAt=Date.now();t.doneDay=dayKey();
      sfx.smash();burst(b,t.color,{coins:'+'+R.quick,text:'SMASH!'});
      ui.justAdded=t.id;ui.justDone=t.id;ui.coinBump=true;
      var L=t.look,tag=L.rarity==='epic'?'EPIC ':(L.rarity==='rare'?'RARE ':'');
      toast('+'+R.quick+' coins · New '+tag+(L.type==='house'?'house':'plant')+': <b>'+esc(L.name)+'</b>');
      commit();scrollTownEnd();
    } else {
      t.done=false;t.doneAt=null;t.doneDay=null;sfx.undo();commit();
    }
  },
  step:function(b,id){
    var t=find(id);if(!t)return;var s=null;t.steps.forEach(function(x){if(x.id===b.dataset.sid)s=x});if(!s)return;
    if(!s.done){
      s.done=true;s.doneAt=Date.now();ui.justStepTask=t.id;ui.justDone=s.id;ui.coinBump=true;
      var b2=t.steps.filter(function(x){return x.done}).length;
      if(b2===t.steps.length){
        t.done=true;t.doneAt=Date.now();t.doneDay=dayKey();
        sfx.build();burst(b,t.look.color,{big:true,coins:'+'+(R.step+R.build),text:'BUILT!'});
        toast('Built! <b>'+esc(t.look.name)+'</b> · +'+R.step+' and a +'+R.build+' bonus');
      } else {
        sfx.step();burst(b,t.look.color,{coins:'+'+R.step});
        toast('Floor '+b2+' of '+t.steps.length+' added to <b>'+esc(t.look.name)+'</b>');
      }
      commit();scrollTownEnd();
    } else {
      s.done=false;s.doneAt=null;if(t.done){t.done=false;t.doneAt=null;t.doneDay=null}sfx.undo();commit();
    }
  },
  menu:function(b,id){sfx.tap();ui.menu=ui.menu===id?null:id;ui.confirmDel=null;render()},
  del:function(b,id){ui.confirmDel=id;render()},
  'del-no':function(){ui.confirmDel=null;ui.menu=null;render()},
  'del-yes':function(b,id){S.tasks=S.tasks.filter(function(t){return t.id!==id});ui.menu=null;ui.confirmDel=null;if(ui.sel===id)ui.sel=null;sfx.undo();commit()},
  'clear-ex':function(){S.tasks=S.tasks.filter(function(t){return !t.ex});S.bonus=0;ui.sel=null;commit();toast('Examples cleared. Your town starts now.')},
  pick:function(b,id){var k=b.classList.contains('plant')?'plant':(b.classList.contains('house')?'house':'tower');selectSound(k);ui.sel=id;if(ui.view!=='town'){ui.view='town';ui.month=monthKey();window.scrollTo(0,0)}render();setTimeout(function(){scrollToItem(id)},40)},
  'go-town':function(){sfx.tap();ui.view='town';ui.month=monthKey();render();window.scrollTo(0,0);scrollTownEnd()},
  view:function(b){sfx.tap();ui.view=b.dataset.v;ui.month=monthKey();ui.menu=null;render();window.scrollTo(0,0);scrollTownEnd()},
  month:function(b){if(!b.dataset.m)return;sfx.tap();ui.month=b.dataset.m;ui.sel=null;render();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})},
  cat:function(b){
    vib(15);var c=ctx();if(c){var n=c.currentTime;tone(c,'sine',420,640,n,.12,.18);tone(c,'sine',640,430,n+.12,.22,.16)}
    var dk=b.dataset.day,p=dk.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
    toast('Shh, this cat is napping. '+esc(d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))+' was a quiet day, and that is okay.');
  },
  'see-month':function(b){$('monthEnd').hidden=true;ui.view='town';ui.month=b.dataset.m;ui.sel=null;render();window.scrollTo(0,0)},
  'close-month':function(){$('monthEnd').hidden=true;ui.view='today';render()},
  'go-build':function(b,id){ui.view='today';ui.menu=null;render();var c=document.querySelector('.step.next[data-id="'+id+'"]');if(c){c.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});setTimeout(function(){c.focus({preventScroll:true})},300)}},
  sound:function(){S.sound=!S.sound;persist();render();if(S.sound)sfx.ding()},
  'open-sheet':openSheet,'close-sheet':closeSheet,
  'switch':function(){setSwitch($('bdSwitch').getAttribute('aria-checked')!=='true');sfx.tap()},
  'add-step':function(){readSteps();if(sheetSteps.length<MAX_STEPS){sheetSteps.push('');renderSteps(sheetSteps.length-1)}},
  'rm-step':function(b){readSteps();sheetSteps.splice(+b.dataset.i,1);if(sheetSteps.length<1)sheetSteps.push('');renderSteps()},
  five:openTimer,'close-timer':closeTimer,'t-go':timerGo
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=act[b.dataset.act];if(a){e.preventDefault();a(b,b.dataset.id,e)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('sheet').hidden)closeSheet();if(!$('timer').hidden)closeTimer();if(!$('monthEnd').hidden){$('monthEnd').hidden=true;render()}}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){render();checkMonth(townItems())}});

/* ---------- add sheet ---------- */
var sheetSteps=['','',''];
function setSwitch(on){
  $('bdSwitch').setAttribute('aria-checked',on?'true':'false');
  $('stepsBox').hidden=!on;$('quickHint').hidden=on;
  $('addCta').textContent=on?'Start building':'Add to my town';
  $('formErr').textContent='';
  if(on)renderSteps();
}
function readSteps(){var ins=$('stepsList').querySelectorAll('input');sheetSteps=Array.prototype.map.call(ins,function(i){return i.value})}
function renderSteps(focusIdx){
  var cs=['#E8263A','#FF8A1F','#7B4BE0','#13B5A6','#FF5FA2','#2F7DF6'];
  $('stepsList').innerHTML=sheetSteps.map(function(v,i){return '<div class="step-in"><span class="dot" style="background:'+cs[i%cs.length]+'">F'+(i+1)+'</span><input id="st-'+i+'" maxlength="60" autocomplete="off" aria-label="Tiny step '+(i+1)+'" placeholder="Tiny step '+(i+1)+'" value="'+esc(v)+'">'+(sheetSteps.length>1?'<button type="button" class="rm" data-act="rm-step" data-i="'+i+'" aria-label="Remove step '+(i+1)+'"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path></svg></button>':'')+'</div>'}).join('');
  $('addStepBtn').hidden=sheetSteps.length>=MAX_STEPS;
  $('floorsHint').innerHTML=CRANE+'<span>Becomes a '+sheetSteps.length+'-floor building, one floor per step</span>';
  if(focusIdx!=null){var el=$('st-'+focusIdx);if(el)el.focus()}
}
function openSheet(){
  ui.menu=null;sheetSteps=['','',''];$('tTitle').value='';setSwitch(false);$('formErr').textContent='';
  $('sheet').hidden=false;setTimeout(function(){$('tTitle').focus()},60);sfx.tap();
}
function closeSheet(){$('sheet').hidden=true}
$('addForm').addEventListener('submit',function(e){
  e.preventDefault();
  var title=$('tTitle').value.trim();
  if(!title){$('formErr').textContent='Give your task a name first.';$('tTitle').focus();return}
  var on=$('bdSwitch').getAttribute('aria-checked')==='true';
  var now=Date.now(),t;
  if(on){
    readSteps();var st=sheetSteps.map(function(s){return s.trim()}).filter(Boolean);
    if(st.length<2){$('formErr').textContent='Add at least 2 steps, or turn the switch off for a quick task.';return}
    t={id:uid(),kind:'big',title:title,createdAt:now,done:false,doneAt:null,doneDay:null,look:bigLook(),steps:st.map(function(x){return{id:uid(),text:x,done:false,doneAt:null}})};
    ui.justAdded=t.id;
  } else {
    t={id:uid(),kind:'quick',title:title,createdAt:now,done:false,doneAt:null,doneDay:null,color:rnd(TASKC),look:quickLook()};
  }
  S.tasks.push(t);closeSheet();ui.view='today';sfx.ding();commit();
  if(on){toast('Construction started: <b>'+esc(t.look.name)+'</b>');scrollTownEnd()}
});

/* ---------- 5 minute timer ---------- */
var TOTAL=300,tEnd=0,tLeft=TOTAL,tInt=null,tDone=false;
var CIRC=2*Math.PI*86;
function tDraw(){var m=Math.floor(tLeft/60),s=Math.ceil(tLeft%60);if(s===60){m++;s=0}$('tNum').textContent=m+':'+String(s).padStart(2,'0');$('tProg').style.strokeDashoffset=String(CIRC*(1-tLeft/TOTAL))}
function openTimer(){
  tLeft=TOTAL;tDone=false;clearInterval(tInt);tInt=null;tEnd=0;
  $('tGo').textContent='Start';$('tMsg').textContent='Start anything. When the ring runs out, you are allowed to stop.';
  $('timer').hidden=false;tDraw();sfx.tap();
}
function closeTimer(){clearInterval(tInt);tInt=null;$('timer').hidden=true}
function tick(){tLeft=Math.max(0,(tEnd-Date.now())/1000);tDraw();if(tLeft<=0)finishTimer()}
function timerGo(){
  if(tDone){closeTimer();return}
  if(tInt){
    clearInterval(tInt);tInt=null;finishTimer(true);return;
  }
  tEnd=Date.now()+tLeft*1000;tInt=setInterval(tick,250);tick();
  $('tGo').textContent='I already started!';$('tMsg').textContent='Go go go. Tap the button the moment you are into it.';sfx.ding();
}
function finishTimer(){
  clearInterval(tInt);tInt=null;if(tDone)return;tDone=true;
  S.bonus=(S.bonus||0)+R.timer;ui.coinBump=true;
  sfx.build();burst($('tNum'),'#E8263A',{big:true,coins:'+'+R.timer,text:'STARTED!'});
  $('tGo').textContent='Done';$('tMsg').textContent='Starting is the hardest part, and you did it. Keep going or take a break.';
  commit();
}

render();
checkMonth(townItems());
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
